<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portfolio — AI and Digital Innovation</title>
  <meta name="description" content="Your AI and Digital Innovation portfolio — lesson progress, badges and certificates.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Portfolio — AI and Digital Innovation">
  <meta property="og:image" content="assets/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#9b1844">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <script>try{var _t=localStorage.getItem('di_theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.setAttribute('data-theme',_t);}catch(e){}</script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/brand.css">
  <style>
    .pf-shell{max-width:820px;margin:0 auto;padding:32px 20px 80px}
    .pf-back{color:var(--text-dim);font-size:.85rem;text-decoration:none;display:inline-flex;align-items:center;gap:4px;margin-bottom:16px}
    .pf-back:hover{color:var(--text)}
    .pf-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding-bottom:18px;margin-bottom:24px;border-bottom:1px solid var(--border)}
    .pf-title h1{font-size:1.6rem;font-weight:800;margin:0 0 4px}
    .pf-title .pf-sub{color:var(--text-dim);font-size:.9rem;line-height:1.45}
    .pf-title .pf-name{color:var(--track-primary);font-weight:700}
    .pf-tools{display:flex;gap:8px;flex-wrap:wrap}
    .pf-crest{height:28px;opacity:.95}
    .pf-empty{padding:40px 20px;text-align:center;color:var(--text-dim);background:var(--bg-card);border:1px dashed var(--border);border-radius:var(--radius)}
    .pf-section{margin-bottom:36px}
    .pf-section-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:6px;border-bottom:1px solid var(--border)}
    .pf-section-head h2{font-size:1.05rem;font-weight:800;margin:0}
    .pf-section-meta{font-size:.78rem;color:var(--text-dim);margin-left:auto}
    .pf-lesson{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:10px;page-break-inside:avoid;break-inside:avoid}
    .pf-lesson-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
    .pf-lesson-title .pf-l-name{font-weight:700;color:var(--text);font-size:.95rem}
    .pf-lesson-title .pf-l-meta{font-size:.74rem;color:var(--text-dim)}
    .pf-note{font-size:.88rem;line-height:1.55;color:var(--text);white-space:pre-wrap;margin-top:8px}
    .pf-exit{font-style:italic;font-size:.9rem;line-height:1.55;color:var(--text);border-left:3px solid var(--track-primary);padding:8px 12px;margin-top:8px;background:rgba(var(--track-primary-rgb),.04);border-radius:0 6px 6px 0}
    .pf-assess{font-size:.9rem;line-height:1.6;color:var(--text);border-left:3px solid #9b1844;padding:10px 12px;margin-top:8px;background:rgba(155,24,68,.05);border-radius:0 6px 6px 0;white-space:pre-wrap}
    .pf-progress{border:1.5px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:20px;background:var(--bg-card)}
    .pf-progress-head{font-weight:800;font-size:.95rem;color:var(--text);margin-bottom:10px}
    .pf-progress-bar{height:8px;border-radius:999px;background:var(--border);overflow:hidden}
    .pf-progress-fill{height:100%;background:linear-gradient(90deg,#9b1844,#c64b74);border-radius:999px;transition:width .4s}
    .pf-progress-meta{font-size:.82rem;color:var(--text-dim);margin-top:8px}
    .pf-progress-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .pf-lvl{font-size:.74rem;font-weight:700;border-radius:999px;padding:3px 10px;border:1px solid}
    .pf-lvl-dev{color:#b45309;background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.4)}
    .pf-lvl-sec{color:#047857;background:rgba(16,185,129,.12);border-color:rgba(16,185,129,.4)}
    .pf-lvl-exc{color:#7c3aed;background:rgba(139,92,246,.14);border-color:rgba(139,92,246,.45)}
    [data-theme="light"] .pf-progress{background:#fff}
    .pf-label{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--track-primary);background:rgba(var(--track-primary-rgb),.1);padding:2px 8px;border-radius:999px;margin-bottom:6px}
    .pf-score-pill{display:inline-block;background:rgba(var(--track-primary-rgb),.12);color:var(--track-primary);border:1px solid rgba(var(--track-primary-rgb),.3);border-radius:999px;padding:2px 10px;font-size:.72rem;font-weight:700}

    /* Print styles — produce a clean PDF through the browser's print-to-PDF */
    @media print {
      body{background:#fff !important;color:#0f172a !important}
      .pf-back,.pf-tools,footer,.pf-empty-actions{display:none !important}
      .pf-shell{padding:0 0 40px;max-width:none}
      .pf-lesson{border:1px solid #cbd5e1 !important;background:#fff !important;box-shadow:none !important}
      .pf-title h1{color:#0f172a}
      .pf-name{color:#9b1844 !important}
      .pf-crest{opacity:1}
      .pf-note,.pf-exit,.pf-l-name{color:#0f172a !important}
      .pf-exit{background:rgba(155,24,68,.05) !important;border-left-color:#9b1844 !important}
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/wow.css">
  <link rel="stylesheet" href="css/editorial.css">
  <link rel="stylesheet" href="css/experience.css">
  <script src="js/course-catalog.js"></script>
  <script src="js/site-experience.js"></script>
</head>
<body>
  <div class="pf-shell">
    <a class="pf-back" href="index.html">← Back to AI and Digital Innovation</a>
    <div class="pf-head">
      <div class="pf-title">
        <h1>My Portfolio</h1>
        <div class="pf-sub">Notes, exit-ticket reflections and scores for <span class="pf-name" id="pfName">—</span></div>
      </div>
      <div class="pf-tools">
        <button class="btn btn-secondary btn-sm" id="pfExportBtn" onclick="pfExportWork()" title="Download a file of your task work and self-ratings to send to your teacher">⬇ Export work</button>
        <button class="btn btn-secondary btn-sm" id="pfShareBtn" onclick="pfShareTeacher()" title="Copy a short code of your self-assessed task levels to send to your teacher">📤 Share code</button>
        <button class="btn btn-primary btn-sm" onclick="window.print()">🖨 Save as PDF</button>
        <img class="hby-mark pf-crest" src="assets/brand/logo/haileybury-magenta.png" alt="Haileybury" width="32" height="23">
      </div>
    </div>

    <div id="pfContent"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/slides-gcse.js"></script>
  <script src="js/shared-content-review.js"></script>
  <script src="js/aep-curriculum.js"></script>
  <script src="js/passport-data.js"></script>
  <script src="js/evidence-tasks.js"></script>
  <script src="js/feedback-cases.js"></script>
  <script src="js/project-source-packs.js"></script>
  <script src="js/learning-feedback.js"></script>
  <script src="js/learning-evidence.js"></script>
  <script>
  (function () {
    function q(name) {
      var m = new RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
      return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : '';
    }
    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    var track = (q('t') || 'removes').toLowerCase();
    if (!['removes','fluency','aep'].includes(track)) track = 'removes';
    document.body.setAttribute('data-track', track);
    document.getElementById('pfShareBtn').style.display = track === 'removes' ? '' : 'none';
    if (track === 'aep') document.querySelector('.pf-sub').firstChild.textContent = 'AEP evidence, notes and reflections for ';

    // Identify the pupil's name from the most-recently-set cert-name entries.
    var name = (track === 'aep' ? localStorage.getItem('di_display_name') : '')
            || localStorage.getItem('gs_cert_name')
            || localStorage.getItem('fl_cert_name')
            || localStorage.getItem('di_display_name')
            || '';

    // Build a compact, human-readable code of self-assessed task levels for the
    // teacher's Class Overview (class.html). Order = the 7 unit tasks.
    window.pfShareTeacher = function () {
      var order = [105, 112, 134, 123, 129, 140, 133];
      var codes = order.map(function (id) {
        var l = localStorage.getItem('di_gcse_assess_level_' + id) || '';
        return l ? l.charAt(0).toUpperCase() : '-';
      });
      var pname = (name || '').trim();
      if (!pname) {
        pname = (window.prompt('Enter your name so your teacher can identify your code:') || '').trim();
        if (pname) { try { localStorage.setItem('gs_cert_name', pname); } catch (e) {} }
      }
      if (!pname) return;
      var line = 'AILIT1|' + encodeURIComponent(pname) + '|' + codes.join('|');
      var btn = document.getElementById('pfShareBtn');
      var done = function (msg) { if (btn) { var o = btn.textContent; btn.textContent = msg; setTimeout(function () { btn.textContent = o; }, 2000); } };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(line).then(function () { done('✓ Code copied — send it to your teacher'); })
          .catch(function () { window.prompt('Copy this code and send it to your teacher:', line); });
      } else {
        window.prompt('Copy this code and send it to your teacher:', line);
      }
    };

    // Full work export — a file containing each task's title, self-rated
    // level AND the written response, for the teacher's Class Overview.
    var PF_TASKS = [
      { l:105, u:'U1', t:'Explain AI Without the Hype' },
      { l:112, u:'U2', t:'Evidence of a Real Revision Loop' },
      { l:134, u:'U3', t:'Prompt-Engineering Portfolio' },
      { l:123, u:'U4', t:'Fact-Check Dossier' },
      { l:129, u:'U5', t:'Ethical Position Paper' },
      { l:140, u:'U6', t:'AI Improvement Brief' },
      { l:133, u:'U7', t:'AI Charter & Career Map' }
    ];
    window.pfExportWork = function () {
      var pname = (name || (track === 'aep' ? 'learner' : '')).trim();
      if (!pname) {
        pname = (window.prompt('Enter your name for the export:') || '').trim();
        if (pname) { try { localStorage.setItem('gs_cert_name', pname); } catch (e) {} }
      }
      if (!pname) return;
      var data = {
        v: 1, type: 'di-removes-portfolio', name: pname, exported: new Date().toISOString(),
        evidence: Object.fromEntries(GCSE_UNITS.flatMap(function(u){return u.lessons;}).map(function(l){return [l.id,DI_EVIDENCE.read(l.id)];}).filter(function(e){return e[1].updatedAt;})),
        tasks: PF_TASKS.map(function (t) {
          return {
            unit: t.u, lesson: t.l, title: t.t,
            level: localStorage.getItem('di_gcse_assess_level_' + t.l) || '',
            response: localStorage.getItem('di_gcse_assess_' + t.l) || ''
          };
        })
      };
      if (track === 'aep') data = {v:1,type:'di-aep-portfolio',name:pname,exported:new Date().toISOString(),lessons:items,evidence:Object.fromEntries(UNITS.flatMap(function(u){return u.lessons;}).map(function(l){return [l.id,DI_EVIDENCE.read(AEP_SHARED_LESSONS[l.id]||l.id)];}).filter(function(e){return e[1].updatedAt;})),earlierEvidence:Object.fromEntries(Object.keys(AEP_SHARED_LESSONS).map(function(id){return [id,DI_EVIDENCE.read(id)];}).filter(function(e){return e[1].updatedAt;}))};
      var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'ai-portfolio-' + pname.replace(/[^a-z0-9]+/gi, '-').toLowerCase().replace(/^-|-$/g, '') + '.json';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      var btn = document.getElementById('pfExportBtn');
      if (btn) { var o = btn.textContent; btn.textContent = '✓ File downloaded'; setTimeout(function () { btn.textContent = o; }, 2000); }
    };
    document.getElementById('pfName').textContent = name || 'this pupil';

    // Gather lessons & notes for the chosen track.
    var items = [];
    if (track === 'removes' && window.GCSE_UNITS) {
      var doneIds = {};
      try { (JSON.parse(localStorage.getItem('di_gcse_v1')) || []).forEach(function (id) { doneIds[id] = true; }); } catch (e) {}
      var dates = {};
      try { dates = JSON.parse(localStorage.getItem('di_gcse_completed_at')) || {}; } catch (e) {}

      GCSE_UNITS.forEach(function (unit) {
        unit.lessons.forEach(function (lesson) {
          var noteText = collectNotes(lesson.id)+(window.DI_FEEDBACK?DI_FEEDBACK.text(lesson.id):'');
          var exitText = collectExit(lesson, 'di_gcse_exit_');
          var assessText = localStorage.getItem('di_gcse_assess_' + lesson.id) || '';
          var assessLevel = localStorage.getItem('di_gcse_assess_level_' + lesson.id) || '';
          var evidence=DI_EVIDENCE.read(lesson.id);
          if (!noteText && !exitText && !assessText && !assessLevel && !doneIds[lesson.id] && !evidence.updatedAt) return;
          items.push({
            unit: unit.title,
            unitColour: unit.color,
            lessonId: lesson.id,
            title: lesson.title,
            done: !!doneIds[lesson.id],
            completedAt: dates[lesson.id] || '',
            notes: noteText,
            exit: exitText,
            assess: assessText,
            assessLevel: assessLevel,
            evidence: evidence.updatedAt ? DI_EVIDENCE.text(lesson.id,evidence) : ''
          });
        });
      });
    } else if (track === 'aep') {
      var aepDone=[],aepDates={};
      try { var savedDone=JSON.parse(localStorage.getItem('di_progress')||'[]');if(Array.isArray(savedDone))aepDone=savedDone; } catch(e){}
      try { aepDates=JSON.parse(localStorage.getItem('di_completion_dates')||'{}')||{}; } catch(e){}
      UNITS.forEach(function(unit){unit.lessons.forEach(function(lesson){
        var source=AEP_SHARED_LESSONS[lesson.id]||lesson.id,notes=collectNotes(source)+(window.DI_FEEDBACK?DI_FEEDBACK.text(source):''),evidence=DI_EVIDENCE.read(source),prefix='di_reflection_'+lesson.id+'_';
        var earlier=AEP_SHARED_LESSONS[lesson.id]?(collectNotes(lesson.id)+'\n'+(DI_EVIDENCE.read(lesson.id).updatedAt?DI_EVIDENCE.text(lesson.id,DI_EVIDENCE.read(lesson.id)):'' )).trim():'';
        if(earlier)notes+='\n\nEarlier AEP lesson · '+lesson.previousTitle+'\n'+earlier;
        var reflections=Object.keys(localStorage).filter(function(k){return k.indexOf(prefix)===0&&/^\d+$/.test(k.slice(prefix.length));}).sort(function(a,b){return Number(a.slice(prefix.length))-Number(b.slice(prefix.length));}).map(function(k){return 'Slide '+(Number(k.slice(prefix.length))+1)+': '+localStorage.getItem(k);}).join('\n\n');
        var done=aepDone.includes(lesson.id);
        if(!notes&&!evidence.updatedAt&&!reflections&&!done)return;
        items.push({unit:unit.title,unitColour:unit.colour,lessonId:lesson.id,title:lesson.title,done:done,completedAt:aepDates[lesson.id]||'',notes:notes,reflections:reflections,evidence:evidence.updatedAt?DI_EVIDENCE.text(source,evidence):''});
      });});
    } else if (track === 'fluency') {
      var passportDone=[];try{passportDone=JSON.parse(localStorage.getItem('fl_progress_removes20_v2')||localStorage.getItem('fl_progress_v1')||'[]');}catch(e){}
      PASSPORT_TRACK.forEach(function(lesson){
        var notes=collectNotes(lesson.id)+(window.DI_FEEDBACK?DI_FEEDBACK.text(lesson.id):''),evidence=DI_EVIDENCE.read(lesson.id),exit=collectExit(lesson,'fl_exit_v2_');
        var done=Array.isArray(passportDone)&&passportDone.includes(lesson.id);
        if(!notes&&!evidence.updatedAt&&!exit&&!done)return;
        items.push({unit:lesson.section,unitColour:'#9b1844',lessonId:lesson.id,title:lesson.title,done:done,notes:notes,exit:exit,evidence:evidence.updatedAt?DI_EVIDENCE.text(lesson.id,evidence):''});
      });
    }

    var content = document.getElementById('pfContent');
    if (!items.length) {
      content.innerHTML = '<div class="pf-empty"><h2 style="margin:0 0 10px;font-weight:700;color:var(--text)">No portfolio entries yet.</h2><p style="margin:0;font-size:.9rem">Complete a few lessons — or jot something in the Notes box inside any slide — and it\'ll appear here.</p><div class="pf-empty-actions" style="margin-top:14px"><a class="btn btn-primary btn-sm" href="' + (track === 'aep' ? 'index.html' : track === 'fluency' ? 'fluency.html' : 'removes.html') + '">Go to lessons</a></div></div>';
      return;
    }

    // Group by unit
    var byUnit = {};
    items.forEach(function (it) {
      if (!byUnit[it.unit]) byUnit[it.unit] = { colour: it.unitColour, entries: [] };
      byUnit[it.unit].entries.push(it);
    });

    function lvlCls(l){ return l === 'Exceptional' ? 'exc' : (l === 'Secure' ? 'sec' : 'dev'); }

    var html = '';

    // Self-assessed performance-task progress (Removes only — 7 unit tasks)
    if (track === 'removes') {
      var lc = { Developing: 0, Secure: 0, Exceptional: 0 }, marked = 0, TOTAL_TASKS = 7;
      items.forEach(function (it) { if (it.assessLevel && lc.hasOwnProperty(it.assessLevel)) { lc[it.assessLevel]++; marked++; } });
      html += '<div class="pf-progress">' +
                '<div class="pf-progress-head">📋 Performance-task progress</div>' +
                '<div class="pf-progress-bar"><div class="pf-progress-fill" style="width:' + Math.round(marked / TOTAL_TASKS * 100) + '%"></div></div>' +
                '<div class="pf-progress-meta">' + marked + ' of ' + TOTAL_TASKS + ' performance tasks self-assessed</div>' +
                (marked ? '<div class="pf-progress-chips">' +
                  '<span class="pf-lvl pf-lvl-dev">Developing · ' + lc.Developing + '</span>' +
                  '<span class="pf-lvl pf-lvl-sec">Secure · ' + lc.Secure + '</span>' +
                  '<span class="pf-lvl pf-lvl-exc">Exceptional · ' + lc.Exceptional + '</span>' +
                '</div>' : '') +
              '</div>';
    }

    Object.keys(byUnit).forEach(function (u) {
      var data = byUnit[u];
      html += '<div class="pf-section">' +
                '<div class="pf-section-head"><h2>' + esc(u) + '</h2>' +
                  '<span class="pf-section-meta">' + data.entries.length + ' entries</span>' +
                '</div>';
      data.entries.forEach(function (e) {
        html += '<div class="pf-lesson">' +
                  (e.done ? '<div class="pf-label">Completed' + (e.completedAt ? ' · ' + e.completedAt : '') + '</div>' : '') +
                  '<div class="pf-lesson-title">' +
                    '<div class="pf-l-name">' + esc(e.title) + '</div>' +
                    (e.lessonId ? '<div class="pf-l-meta">Lesson #' + esc(String(e.lessonId)) + '</div>' : '') +
                  '</div>';
        if (e.evidence) html += '<div class="pf-assess"><strong>Evidence of learning</strong><br>'+esc(e.evidence)+'</div>';
        if (e.reflections) html += '<div class="pf-note"><strong>Reflections</strong><br>'+esc(e.reflections)+'</div>';
        if (e.notes) html += '<div class="pf-note">' + esc(e.notes) + '</div>';
        if (e.exit)  html += '<div class="pf-exit"><strong>Exit ticket.</strong> ' + esc(e.exit) + '</div>';
        if (e.assess || e.assessLevel) html += '<div class="pf-assess"><strong>📋 Assessed task.</strong>' + (e.assessLevel ? ' <span class="pf-lvl pf-lvl-' + lvlCls(e.assessLevel) + '">Self-rated: ' + esc(e.assessLevel) + '</span>' : '') + (e.assess ? ' ' + esc(e.assess) : '') + '</div>';
        html += '</div>';
      });
      html += '</div>';
    });
    content.innerHTML = html;

    // Collect all di_note_<id>_<idx> entries for a given lesson id, joined
    // into one readable string grouped by slide index.
    function collectExit(lesson,prefix){var current=localStorage.getItem(prefix+lesson.id+(lesson.revision?'_'+lesson.revision:''))||'';var old=lesson.revision?localStorage.getItem(prefix+lesson.id)||'':'';return [current,old?'Earlier lesson version: '+old:''].filter(Boolean).join('\n\n');}
    function collectNotes(lessonId) {
      var parts = [];
      var prefix = 'di_note_' + lessonId + '_';
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (!k || k.indexOf(prefix) !== 0) continue;
        var match = /^(?:(r[0-9]+)_)?(\d+)$/.exec(k.slice(prefix.length));
        if (!match) continue;
        var idx = Number(match[2]);
        var v = (localStorage.getItem(k) || '').trim();
        if (v) parts.push({ idx: idx, text: v, revision: match[1] || '' });
      }
      parts.sort(function (a, b) { return a.idx - b.idx; });
      var lesson=GCSE_UNITS.flatMap(function(u){return u.lessons;}).find(function(l){return l.id===lessonId;});var revision=(lesson&&lesson.revision)||({115:'r2',120:'r2',128:'r2'})[lessonId]||'';
      return parts.map(function(p){return (revision?(p.revision===revision?'Current lesson · ':'Earlier lesson version · '):'')+'Slide '+(p.idx+1)+': '+p.text;}).join('\n\n');
    }
  })();
  </script>
</body>
</html>
