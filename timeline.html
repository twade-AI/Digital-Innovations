<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital Innovations — The Learning Journey</title>
<meta name="description" content="An interactive, sequential timeline of all 59 lessons across the six units of the Digital Innovations AEP.">
<link rel="icon" href="icon.svg">
<style>
  @font-face { font-family:'Calluna Sans'; src:url('assets/brand/fonts/CallunaSans-Regular.otf'); font-weight:400; font-style:normal; font-display:swap; }
  @font-face { font-family:'Calluna Sans'; src:url('assets/brand/fonts/CallunaSans-Bold.otf'); font-weight:700; font-style:normal; font-display:swap; }
  @font-face { font-family:'Calluna Sans'; src:url('assets/brand/fonts/CallunaSans-Light.otf'); font-weight:300; font-style:normal; font-display:swap; }

  :root{
    --bg-0:#0b0d12; --bg-1:#11141c; --bg-2:#161a24;
    --ink:#eef1f6; --ink-soft:#c4ccd8; --ink-mute:#8b94a4;
    --line:rgba(255,255,255,.09);
    --magenta:#9b1844; --cyan:#009fe3;
    --track-h: clamp(540px, 72vh, 780px);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; font-family:'Calluna Sans','Inter',system-ui,sans-serif;
    color:var(--ink); background:var(--bg-0);
    background-image:
      radial-gradient(1100px 540px at 14% -8%, rgba(155,24,68,.18), transparent 60%),
      radial-gradient(1000px 520px at 92% 0%, rgba(0,159,227,.16), transparent 58%),
      linear-gradient(180deg, var(--bg-1), var(--bg-0));
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  a{ color:inherit; }

  /* ── Top bar ───────────────────────────────────────── */
  .topbar{
    position:sticky; top:0; z-index:60;
    display:flex; align-items:center; justify-content:space-between; gap:18px; flex-wrap:wrap;
    padding:14px clamp(16px,3vw,32px) 12px;
    background:linear-gradient(180deg, rgba(11,13,18,.92), rgba(11,13,18,.66) 70%, transparent);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .brand{ display:flex; align-items:center; gap:14px; min-width:0; }
  .brand img{ height:34px; width:auto; display:block; }
  .brand .sep{ width:1px; height:30px; background:var(--line); }
  .brand h1{ margin:0; font-size:clamp(15px,2.2vw,19px); font-weight:700; letter-spacing:-.2px; line-height:1.05; }
  .brand p{ margin:2px 0 0; font-size:11.5px; color:var(--ink-mute); letter-spacing:.2px; }
  .brand .accent{ color:#f6a8c2; }

  .legend{ display:flex; align-items:center; gap:7px; flex-wrap:wrap; justify-content:flex-end; }
  .chip{
    --uc:#888; cursor:pointer; border:0; font-family:inherit;
    display:inline-flex; align-items:center; gap:7px;
    padding:6px 11px 6px 8px; border-radius:99px; font-size:12px; font-weight:700; letter-spacing:.1px;
    color:var(--ink-soft); background:rgba(255,255,255,.04);
    border:1px solid var(--line); transition:.22s; white-space:nowrap;
  }
  .chip .swatch{ width:11px; height:11px; border-radius:50%; background:var(--uc); box-shadow:0 0 9px -1px var(--uc); }
  .chip .ic{ font-size:13px; }
  .chip:hover{ color:#fff; border-color:color-mix(in srgb,var(--uc) 60%, transparent); background:color-mix(in srgb,var(--uc) 16%, transparent); }
  .chip.active{ color:#fff; background:color-mix(in srgb,var(--uc) 26%, transparent); border-color:color-mix(in srgb,var(--uc) 70%, transparent); box-shadow:0 4px 18px -8px var(--uc); }
  .chip .n{ color:var(--ink-mute); font-weight:600; }
  .chip.active .n{ color:rgba(255,255,255,.7); }

  /* progress rail under the bar */
  .progress{ position:sticky; top:0; z-index:59; height:3px; background:transparent; }
  .progress > i{ display:block; height:100%; width:0%;
    background:linear-gradient(90deg,var(--magenta),#8b5cf6,var(--cyan),#22c55e,#f59e0b,#ef4444);
    box-shadow:0 0 14px rgba(0,159,227,.5); transition:width .08s linear; }

  /* ── Sub header / orientation ─────────────────────── */
  .subhead{ display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
    padding:12px clamp(16px,3vw,32px) 4px; }
  .nowunit{ display:flex; align-items:center; gap:11px; min-height:30px; }
  .nowunit .badge{ --uc:var(--magenta); display:inline-flex; align-items:center; gap:9px;
    padding:6px 14px; border-radius:99px; font-weight:700; font-size:14px; color:#fff;
    background:color-mix(in srgb,var(--uc) 24%, var(--bg-2)); border:1px solid color-mix(in srgb,var(--uc) 55%, transparent);
    box-shadow:0 6px 22px -10px var(--uc); transition:.3s; }
  .nowunit .badge .ic{ font-size:16px; }
  .nowunit .badge .cnt{ font-weight:600; font-size:12px; opacity:.8; }
  .hint{ font-size:12px; color:var(--ink-mute); display:flex; align-items:center; gap:8px; }
  .hint kbd{ font-family:inherit; font-size:11px; background:rgba(255,255,255,.06); border:1px solid var(--line);
    border-bottom-width:2px; border-radius:5px; padding:1px 6px; color:var(--ink-soft); }

  /* ── Timeline scroller ────────────────────────────── */
  .scroll{
    position:relative; overflow-x:auto; overflow-y:hidden;
    height:var(--track-h); margin-top:6px;
    cursor:grab; scroll-behavior:smooth; -webkit-overflow-scrolling:touch;
    -ms-overflow-style:none;
  }
  .scroll.grabbing{ cursor:grabbing; scroll-behavior:auto; }
  .scroll:focus-visible{ outline:2px solid var(--cyan); outline-offset:-3px; }
  .scroll::-webkit-scrollbar{ height:10px; }
  .scroll::-webkit-scrollbar-track{ background:rgba(255,255,255,.03); }
  .scroll::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.16); border-radius:99px; border:2px solid transparent; background-clip:padding-box; }
  .scroll::-webkit-scrollbar-thumb:hover{ background:rgba(255,255,255,.28); background-clip:padding-box; }

  .track{ position:relative; display:flex; align-items:stretch; height:100%;
    padding:0 clamp(40px,8vw,120px); width:max-content; }

  /* ── Unit group ───────────────────────────────────── */
  .group{ --uc:#888; position:relative; display:flex; align-items:stretch; }
  .group::before{ /* faint unit tint */
    content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, color-mix(in srgb,var(--uc) 9%, transparent), transparent 55%, color-mix(in srgb,var(--uc) 9%, transparent));
    pointer-events:none;
  }
  .group::after{ /* divider at unit start */
    content:""; position:absolute; left:0; top:18%; bottom:18%; width:1px;
    background:linear-gradient(180deg, transparent, var(--line), transparent);
  }
  .group:first-child::after{ display:none; }

  .uhead{ position:sticky; left:14px; z-index:18; align-self:flex-start;
    margin-top:18px; display:inline-flex; align-items:center; gap:9px; white-space:nowrap;
    padding:8px 14px; border-radius:99px; font-weight:700; font-size:13.5px; color:#fff;
    background:color-mix(in srgb,var(--uc) 26%, var(--bg-1)); border:1px solid color-mix(in srgb,var(--uc) 60%, transparent);
    box-shadow:0 8px 26px -12px var(--uc); pointer-events:none; }
  .uhead .ic{ font-size:16px; }
  .uhead .cnt{ font-weight:600; font-size:11.5px; opacity:.78; }
  /* uhead lives inside an absolutely-stacked layer so it doesn't take row width */
  .uhead-wrap{ position:absolute; inset:0; pointer-events:none; }

  .spine{ position:absolute; left:0; right:0; top:50%; height:5px; transform:translateY(-50%);
    background:linear-gradient(90deg, color-mix(in srgb,var(--uc) 40%, transparent), var(--uc) 12%, var(--uc) 88%, color-mix(in srgb,var(--uc) 40%, transparent));
    box-shadow:0 0 18px -2px var(--uc), 0 0 2px var(--uc); }
  .spine::after{ content:""; position:absolute; inset:0; border-radius:99px;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
    background-size:240px 100%; background-repeat:no-repeat; mix-blend-mode:screen;
    animation:shimmer 5.5s linear infinite; opacity:.0; }
  .group:hover .spine::after{ opacity:.7; }
  @keyframes shimmer{ from{ background-position:-260px 0; } to{ background-position:calc(100% + 260px) 0; } }

  /* ── Slot / station ───────────────────────────────── */
  /* width is set explicitly (not just flex-basis): every child of a slot is
     absolutely positioned, so without it the slot contributes 0 to the group's
     intrinsic width and the unit groups collapse and overlap. */
  .slot{ position:relative; flex:0 0 150px; width:150px; height:100%; }
  .slot:hover, .slot:focus-within, .slot.pinned{ z-index:40; }
  .anchor{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); }

  .node{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:36px; height:36px; border-radius:50%; display:grid; place-items:center;
    background:radial-gradient(circle at 32% 28%, color-mix(in srgb,var(--uc) 60%, #fff 32%), var(--uc) 70%);
    color:#fff; font-weight:700; font-size:13px; cursor:pointer; border:none;
    box-shadow:0 0 0 4px var(--bg-0), 0 0 0 5px color-mix(in srgb,var(--uc) 50%, transparent), 0 0 16px -1px var(--uc);
    transition:transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s; font-family:inherit; }
  .node::before{ content:""; position:absolute; inset:-9px; border-radius:50%;
    border:1px solid color-mix(in srgb,var(--uc) 45%, transparent); opacity:0; transition:.3s; }
  .slot:hover .node, .slot:focus-within .node, .slot.pinned .node{
    transform:translate(-50%,-50%) scale(1.22);
    box-shadow:0 0 0 4px var(--bg-0), 0 0 0 6px color-mix(in srgb,var(--uc) 70%, transparent), 0 0 30px 2px var(--uc); }
  .slot:hover .node::before, .slot:focus-within .node::before, .slot.pinned .node::before{ opacity:1; inset:-7px; }

  .label{ position:absolute; left:50%; transform:translateX(-50%); width:138px; text-align:center;
    font-size:12.5px; line-height:1.24; color:var(--ink-soft); letter-spacing:.05px; transition:color .2s; }
  .label .ln{ display:block; font-size:10px; font-weight:700; letter-spacing:.6px; color:var(--ink-mute); margin-bottom:2px; }
  .slot:hover .label, .slot:focus-within .label, .slot.pinned .label{ color:#fff; }
  .slot.up .label{ bottom:calc(50% + 30px); }
  .slot.down .label{ top:calc(50% + 30px); }

  /* connector tick */
  .tick{ position:absolute; left:50%; transform:translateX(-50%); width:2px; height:16px;
    background:linear-gradient(var(--uc), transparent); opacity:.5; }
  .slot.up .tick{ bottom:calc(50% + 14px); background:linear-gradient(transparent,var(--uc)); }
  .slot.down .tick{ top:calc(50% + 14px); }

  /* ── Hover card ───────────────────────────────────── */
  .card{ position:absolute; left:50%; width:268px; transform:translateX(-50%) translateY(8px);
    background:linear-gradient(180deg, color-mix(in srgb,var(--uc) 12%, rgba(20,24,33,.94)), rgba(16,19,27,.96));
    border:1px solid color-mix(in srgb,var(--uc) 40%, var(--line)); border-radius:14px;
    box-shadow:0 24px 60px -20px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.03), 0 0 28px -10px var(--uc);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    padding:14px 15px 13px; opacity:0; visibility:hidden; pointer-events:none;
    transition:opacity .2s, transform .25s cubic-bezier(.2,.8,.2,1); z-index:5;
    max-height:min(300px,40vh); overflow-y:auto; overscroll-behavior:contain; }
  .card::-webkit-scrollbar{ width:7px; }
  .card::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.18); border-radius:9px; }
  .slot.up .card{ bottom:calc(50% + 76px); }
  .slot.down .card{ top:calc(50% + 76px); }
  .slot:hover .card, .slot:focus-within .card, .slot.pinned .card{ opacity:1; visibility:visible; pointer-events:auto; transform:translateX(-50%) translateY(0); }
  /* little pointer */
  .card::after{ content:""; position:absolute; left:50%; width:12px; height:12px; transform:translateX(-50%) rotate(45deg);
    background:rgba(16,19,27,.96); border:1px solid color-mix(in srgb,var(--uc) 40%, var(--line)); }
  .slot.up .card::after{ bottom:-7px; border-top:none; border-left:none; }
  .slot.down .card::after{ top:-7px; border-bottom:none; border-right:none; }

  .card .eyebrow{ display:flex; align-items:center; gap:7px; font-size:11px; font-weight:700; letter-spacing:.3px;
    text-transform:uppercase; color:color-mix(in srgb,var(--uc) 55%, #fff); margin-bottom:6px; }
  .card .eyebrow .ic{ font-size:13px; }
  .card h3{ margin:0 0 7px; font-size:15.5px; line-height:1.18; font-weight:700; color:#fff; }
  .card .desc{ margin:0 0 10px; font-size:12.4px; line-height:1.5; color:var(--ink-soft); }
  .card .meta{ display:flex; flex-wrap:wrap; gap:5px; margin-bottom:10px; }
  .pill{ font-size:10.5px; font-weight:700; letter-spacing:.3px; text-transform:uppercase;
    padding:3px 9px; border-radius:99px; border:1px solid transparent; }
  .pill.diff-beginner{ color:#86efac; background:rgba(34,197,94,.14); border-color:rgba(34,197,94,.35); }
  .pill.diff-intermediate{ color:#fcd34d; background:rgba(245,158,11,.14); border-color:rgba(245,158,11,.35); }
  .pill.diff-advanced{ color:#fca5a5; background:rgba(239,68,68,.14); border-color:rgba(239,68,68,.35); }
  .pill.tag{ color:var(--ink-soft); background:rgba(255,255,255,.05); border-color:var(--line); text-transform:none; letter-spacing:0; font-weight:600; }
  .card .obj{ border-top:1px solid var(--line); padding-top:9px; }
  .card .obj h4{ margin:0 0 6px; font-size:10.5px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:var(--ink-mute); }
  .card .obj ul{ margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:5px; }
  .card .obj li{ position:relative; padding-left:16px; font-size:12px; line-height:1.35; color:var(--ink-soft); }
  .card .obj li::before{ content:""; position:absolute; left:2px; top:6px; width:6px; height:6px; border-radius:50%;
    background:var(--uc); box-shadow:0 0 8px -1px var(--uc); }

  /* entrance */
  .slot.pre{ opacity:0; transform:translateY(14px); }
  .slot.pre .node, .slot.pre .label, .slot.pre .tick{ transition:none; }
  .slot.reveal{ opacity:1; transform:none; transition:opacity .5s ease, transform .55s cubic-bezier(.2,.8,.2,1); }

  /* edge fades on the scroller */
  .stage{ position:relative; }
  .stage::before, .stage::after{ content:""; position:absolute; top:0; bottom:14px; width:54px; z-index:8; pointer-events:none; }
  .stage::before{ left:0; background:linear-gradient(90deg, var(--bg-0), transparent); }
  .stage::after{ right:0; background:linear-gradient(270deg, var(--bg-0), transparent); }

  footer{ padding:16px clamp(16px,3vw,32px) 26px; color:var(--ink-mute); font-size:11.5px;
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  footer .dots{ letter-spacing:2px; }
  .nojs{ padding:40px; text-align:center; color:var(--ink-soft); }

  @media (max-width:640px){
    .legend{ display:none; }
    .label{ width:120px; font-size:11.5px; }
    .slot{ flex-basis:128px; width:128px; }
    .card{ width:230px; }
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; }
    .scroll{ scroll-behavior:auto; }
    .slot.pre{ opacity:1; transform:none; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <img src="assets/brand/logo/haileybury-white.png" alt="Haileybury" onerror="this.style.display='none'">
    <div class="sep"></div>
    <div>
      <h1>Digital Innovations <span class="accent">·</span> The Learning Journey</h1>
      <p id="brandSub">59 lessons across 6 units — in sequence</p>
    </div>
  </div>
  <nav class="legend" id="legend" aria-label="Jump to a unit"></nav>
</header>
<div class="progress"><i id="progressFill"></i></div>

<div class="subhead">
  <div class="nowunit"><span class="badge" id="nowBadge"><span class="ic">🧠</span><span class="nm">Foundations of AI</span> <span class="cnt"></span></span></div>
  <div class="hint">
    <span>Scroll sideways</span><kbd>←</kbd><kbd>→</kbd>
    <span>· hover a stop for detail · tap to pin</span>
  </div>
</div>

<div class="stage">
  <div class="scroll" id="scroll" tabindex="0" role="list" aria-label="Course lessons in sequence">
    <div class="track" id="track"></div>
  </div>
</div>

<footer>
  <span><strong style="color:#f6a8c2">Haileybury</strong> · Digital Innovations AEP &nbsp;·&nbsp; Clear · Critical · Responsible</span>
  <span class="dots">● ● ● ● ● ●</span>
</footer>

<script src="js/data.js"></script>
<script>
(function(){
  function start(){
    var track = document.getElementById('track');
    if (typeof UNITS === 'undefined' || !Array.isArray(UNITS)) {
      track.innerHTML = '<div class="nojs">Course data (js/data.js) could not be loaded. Open this page from within the Digital Innovations project so the lesson data is available.</div>';
      return;
    }

    var DIFF = ['beginner','intermediate','advanced'];
    var esc = function(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); };

    // Build the sequence exactly as the app numbers it: units in order, lessons in array order.
    var n = 0, groups = [], legendHTML = '';
    UNITS.forEach(function(unit){
      var g = document.createElement('section');
      g.className = 'group';
      g.style.setProperty('--uc', unit.colour);
      g.setAttribute('aria-label', 'Unit ' + (unit.id+1) + ': ' + unit.title);

      var spine = document.createElement('div'); spine.className = 'spine'; g.appendChild(spine);

      var hw = document.createElement('div'); hw.className = 'uhead-wrap';
      var uh = document.createElement('div'); uh.className = 'uhead';
      uh.innerHTML = '<span class="ic">' + esc(unit.icon) + '</span>' +
                     '<span>Unit ' + (unit.id+1) + ' · ' + esc(unit.title) + '</span>' +
                     '<span class="cnt">' + unit.lessons.length + '</span>';
      hw.appendChild(uh); g.appendChild(hw);

      unit.lessons.forEach(function(l){
        n++;
        var up = (n % 2 === 1);
        var slot = document.createElement('div');
        slot.className = 'slot ' + (up ? 'up' : 'down');
        slot.setAttribute('role','listitem');
        slot.tabIndex = 0;
        slot.setAttribute('aria-label', 'Lesson ' + n + ': ' + l.title + '. ' + (l.desc||''));

        var diff = DIFF.indexOf(l.difficulty) >= 0 ? l.difficulty : 'intermediate';
        var tags = (l.tags||[]).slice(0,3).map(function(t){ return '<span class="pill tag">' + esc(t) + '</span>'; }).join('');
        var objs = (l.objectives||[]).slice(0,4).map(function(o){ return '<li>' + esc(o) + '</li>'; }).join('');

        slot.innerHTML =
          '<div class="tick"></div>' +
          '<button class="node" tabindex="-1" aria-hidden="true">' + n + '</button>' +
          '<div class="label"><span class="ln">LESSON ' + n + '</span>' + esc(l.title) + '</div>' +
          '<div class="card" role="tooltip">' +
            '<div class="eyebrow"><span class="ic">' + esc(unit.icon) + '</span> Unit ' + (unit.id+1) + ' · ' + esc(unit.title) + '</div>' +
            '<h3>' + esc(l.title) + '</h3>' +
            '<p class="desc">' + esc(l.desc) + '</p>' +
            '<div class="meta"><span class="pill diff-' + diff + '">' + diff + '</span>' + tags + '</div>' +
            (objs ? '<div class="obj"><h4>By the end you can</h4><ul>' + objs + '</ul></div>' : '') +
          '</div>';
        g.appendChild(slot);
      });

      track.appendChild(g);
      groups.push({ el:g, unit:unit });

      legendHTML += '<button class="chip" data-idx="' + (groups.length-1) + '" style="--uc:' + unit.colour + '">' +
        '<span class="swatch"></span><span class="ic">' + esc(unit.icon) + '</span>' +
        esc(unit.title) + ' <span class="n">' + unit.lessons.length + '</span></button>';
    });

    document.getElementById('brandSub').textContent = n + ' lessons across ' + UNITS.length + ' units — in sequence';

    var legend = document.getElementById('legend');
    legend.innerHTML = legendHTML;
    var chips = Array.prototype.slice.call(legend.querySelectorAll('.chip'));

    var scroll = document.getElementById('scroll');
    var fill = document.getElementById('progressFill');
    var nowBadge = document.getElementById('nowBadge');

    // ── Jump to unit
    chips.forEach(function(chip){
      chip.addEventListener('click', function(){
        var g = groups[+chip.dataset.idx];
        if (g) scroll.scrollLeft = g.el.offsetLeft - 24;
      });
    });

    // ── Entrance animation
    if ('IntersectionObserver' in window) {
      var slots = track.querySelectorAll('.slot');
      slots.forEach(function(s){ s.classList.add('pre'); });
      var io = new IntersectionObserver(function(entries){
        entries.forEach(function(e){
          if (e.isIntersecting){
            var s = e.target;
            s.style.transitionDelay = ((Array.prototype.indexOf.call(s.parentNode.children, s) % 10) * 28) + 'ms';
            s.classList.remove('pre'); s.classList.add('reveal');
            io.unobserve(s);
          }
        });
      }, { root: scroll, rootMargin:'0px 120px 0px 120px', threshold:0.05 });
      slots.forEach(function(s){ io.observe(s); });
    }

    // ── Wheel → horizontal
    scroll.addEventListener('wheel', function(e){
      if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { scroll.scrollLeft += e.deltaY; e.preventDefault(); }
    }, { passive:false });

    // ── Drag to pan (with tap detection for touch pin)
    var down=false, moved=false, startX=0, startL=0, downSlot=null;
    scroll.addEventListener('pointerdown', function(e){
      if (e.button && e.button!==0) return;
      down=true; moved=false; startX=e.clientX; startL=scroll.scrollLeft;
      downSlot = e.target.closest ? e.target.closest('.slot') : null;
      scroll.classList.add('grabbing');
    });
    window.addEventListener('pointermove', function(e){
      if (!down) return;
      var dx = e.clientX - startX;
      if (Math.abs(dx) > 6) moved = true;
      scroll.scrollLeft = startL - dx;
    });
    window.addEventListener('pointerup', function(e){
      if (!down) return;
      down=false; scroll.classList.remove('grabbing');
      if (!moved && downSlot){           // a tap → toggle pin (touch friendly)
        var wasPinned = downSlot.classList.contains('pinned');
        track.querySelectorAll('.slot.pinned').forEach(function(s){ s.classList.remove('pinned'); });
        if (!wasPinned) downSlot.classList.add('pinned');
      } else if (!moved) {
        track.querySelectorAll('.slot.pinned').forEach(function(s){ s.classList.remove('pinned'); });
      }
      downSlot=null;
    });

    // ── Keyboard
    scroll.addEventListener('keydown', function(e){
      var step = Math.max(220, scroll.clientWidth * 0.6);
      if (e.key==='ArrowRight'){ scroll.scrollLeft += step; e.preventDefault(); }
      else if (e.key==='ArrowLeft'){ scroll.scrollLeft -= step; e.preventDefault(); }
      else if (e.key==='Home'){ scroll.scrollLeft = 0; e.preventDefault(); }
      else if (e.key==='End'){ scroll.scrollLeft = scroll.scrollWidth; e.preventDefault(); }
    });
    // keep a focused station in view
    track.addEventListener('focusin', function(e){
      var s = e.target.closest('.slot'); if (!s) return;
      var l = s.offsetLeft, r = l + s.offsetWidth, vl = scroll.scrollLeft, vr = vl + scroll.clientWidth;
      if (l < vl + 60) scroll.scrollLeft = l - 60;
      else if (r > vr - 60) scroll.scrollLeft = r - scroll.clientWidth + 60;
    });

    // ── Scroll → progress + current unit
    var ticking = false;
    function onScroll(){
      var max = scroll.scrollWidth - scroll.clientWidth;
      var pct = max > 0 ? (scroll.scrollLeft / max) * 100 : 0;
      fill.style.width = pct.toFixed(2) + '%';

      var probe = scroll.scrollLeft + Math.min(scroll.clientWidth * 0.32, 360);
      // Guard against running before the flex track has been laid out (all
      // offsetLeft === 0), which would otherwise select the last unit.
      var ready = groups.length < 2 || groups[groups.length - 1].el.offsetLeft > 0;
      var cur = 0;
      if (ready) {
        for (var i=0;i<groups.length;i++){
          if (probe >= groups[i].el.offsetLeft) cur = i; else break;
        }
      }
      if (cur !== onScroll._cur){
        onScroll._cur = cur;
        var u = groups[cur].unit;
        nowBadge.style.setProperty('--uc', u.colour);
        nowBadge.querySelector('.ic').textContent = u.icon;
        nowBadge.querySelector('.nm').textContent = 'Unit ' + (u.id+1) + ' · ' + u.title;
        nowBadge.querySelector('.cnt').textContent = u.lessons.length + ' lessons';
        chips.forEach(function(c,i){ c.classList.toggle('active', i===cur); });
      }
      ticking = false;
    }
    onScroll._cur = -1;
    scroll.addEventListener('scroll', function(){ if (!ticking){ ticking=true; requestAnimationFrame(onScroll); } });
    window.addEventListener('resize', onScroll);
    // Defer the first run until the flex track has actually been laid out.
    requestAnimationFrame(function(){ requestAnimationFrame(onScroll); });
    window.addEventListener('load', onScroll);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
</script>
</body>
</html>
