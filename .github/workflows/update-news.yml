name: Update AI News

# Refreshes js/news-live.js from public AI news feeds so the
# "AI in the News" section stays current without manual curation.
# Runs every morning; can also be triggered by hand from the
# Actions tab (Run workflow).
on:
  schedule:
    - cron: '17 6 * * *' # Daily at 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-ai-news
  cancel-in-progress: false

jobs:
  update-news:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest headlines
        run: node scripts/update-news.mjs

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet js/news-live.js; then
            echo "News already up to date — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/news-live.js
          git commit -m "Auto-update AI news headlines"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN commits do not trigger the legacy Pages build automatically.
      - name: Rebuild the published site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
